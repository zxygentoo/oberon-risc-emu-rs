[package]
name = "risc-core"
version = "0.1.0"
edition = "2021"
license = "ISC"
description = "Pure RISC5 core (CPU, FP, MMIO, disk, serial) for the Project Oberon emulator"

[features]
# Differential co-simulation: compiles the C reference (risc.c + risc-fp.c +
# disk.c via cosim/shim.c) and links it for live FFI comparison. Opt-in; needs a
# C toolchain and the sibling C repo (path via OBERON_C_SRC). See build.rs,
# src/cosim.rs, tests/cosim.rs.
cosim = ["dep:cc"]

[dependencies]
# The four ALU status flags as a typed set (macro_rules-based, no proc-macro
# deps, keeping the core dependency-light).
bitflags = "2"

# Used only by the unix raw-serial device (poll(2) + non-blocking fds);
# rustix's safe wrappers keep the crate free of unsafe outside the cosim FFI.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["event", "fs"] }

[build-dependencies]
# Compiles the C reference shim for the `cosim` feature only.
cc = { version = "1", optional = true }

[lints]
workspace = true
