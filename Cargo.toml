[package]
name = "oberon-risc-emu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Rust port of Peter De Wachter's Project Oberon RISC5 emulator"
readme = "README.md"
default-run = "risc"

[lib]
name = "oberon_risc_emu"
path = "src/lib.rs"

[[bin]]
name = "risc"
path = "src/bin/risc.rs"

[features]
default = ["frontend"]
# The GUI stack. `cargo test --no-default-features` builds the pure core alone
# (fast, no windowing/clipboard system libs) for headless CI.
frontend = ["dep:winit", "dep:softbuffer", "dep:arboard", "dep:clap", "dep:thiserror"]
# Differential co-simulation: compiles the C reference (risc.c + risc-fp.c +
# disk.c via cosim/shim.c) and links it for live FFI comparison. Opt-in; needs a
# C toolchain and the sibling C repo (path via OBERON_C_SRC). See build.rs,
# src/cosim.rs, tests/cosim.rs.
cosim = ["dep:cc"]

[dependencies]
# Pinned as a known-good trio: winit 0.30 + softbuffer 0.4 share raw-window-handle 0.6.
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
arboard = { version = "3", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
# Typed frontend errors (src/error.rs). Frontend-only so the pure-core build
# (`--no-default-features`) stays dependency-free.
thiserror = { version = "2", optional = true }

# Used only by the unix raw-serial device (poll(2) + non-blocking fds); already
# present transitively via winit.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# Compiles the C reference shim for the `cosim` feature only.
cc = { version = "1", optional = true }
