[package]
name = "host-tools"
version = "0.1.0"
edition = "2021"
license = "ISC"
description = "Host-side Oberon tools: text/archive converters and a Project Oberon disk-image builder and source extractor"

# CLI tools, auto-discovered from src/bin/:
#   ob2unix        - dump the plain-text content of an Oberon Text file
#   asciidecoder   - unpack an 'AsciiCoder.DecodeFiles' archive
#   build-image    - compile Project Oberon and assemble a runnable disk image
#   extract-source - extract the source files from a Project Oberon disk image
#   eo-driver      - boot an Extended Oberon image headless and drive it (WIP)
# All are pure std except build-image and eo-driver, which run on the risc-core
# CPU: build-image via the headless "shim" runtime (src/bin/build-image/shim.rs,
# a Rust port of project-norebo), eo-driver by booting the full system.
#
# src/lib.rs holds the handful of Oberon rules the binaries must agree on (the
# file-name character set today), so the per-binary copies can't drift.

[dependencies]
# CLI parsing for all four tools (clap 4 derive is already used by the `risc` frontend).
clap = { version = "4", features = ["derive"] }
# Used only by build-image (via its shim module); the file converters don't.
risc-core = { path = "../risc-core" }

[lints]
workspace = true
